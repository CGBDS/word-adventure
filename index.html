<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#4aa8ff">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Word Adventure — La Máquina del Tiempo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <div class="clouds" aria-hidden="true"><span></span><span></span><span></span></div>
  <header id="hud" class="hidden">
    <div class="hud-left">
      <div id="hud-level" class="level-badge">1</div>
      <div class="xp-wrap">
        <div class="xp-bar"><div id="hud-xp" class="xp-fill"></div></div>
        <div id="hud-xp-text" class="xp-text">0 XP</div>
      </div>
    </div>
    <div class="hud-right">
      <div class="pill" id="hud-streak" title="Racha">🔥 0</div>
      <div class="pill coins" id="hud-coins" title="Monedas">🪙 0</div>
      <button class="icon-btn" id="hud-settings" aria-label="Ajustes">⚙️</button>
    </div>
  </header>
  <main id="screen"></main>
  <div id="overlay" class="hidden"></div>
  <div id="toast" class="hidden"></div>
</div>
<script src="js/data.js"></script>
<script src="js/audio.js"></script>
<script src="js/minigames.js"></script>
<script src="js/game.js"></script>
</body>
</html>
